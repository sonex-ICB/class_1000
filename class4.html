<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
        p{
            color:red;
        }
        .barbie{
          color:#fff;
          background: #009;
          padding: 30px;
          padding-top:0px;
          padding: 0px 30px 50px 100px;
          padding: 30px 0px;
          border-radius: 10px;
          border-radius: 40px 0px;
          border-radius: 0px 10px 40px 100px;
          border-radius: 10px;

          /* classwork */
        }
        .cls{
          background: orange;
          padding:40px;
          border-radius: 50px 50px 0 0;
          border:10px inset #900;
          /*solid, double, dotted, inset */
          border-top:5px solid #006;
          border-left-color: yellow;

          margin: 20px;
          margin-top:50px; 
          margin: 100px 0;
        }
        .btn1{
          padding: 10px 30px;
          border: 0;
          background: linear-gradient(#009,#003);
          font-weight: bold;
          color:#fff;
          &:hover{
            background: red;
          }
        }
  </style>

</head>
<body>
  <h1 class="barbie"> Lorem, ipsum.</h1>
  <h1> Lorem, ipsum.</h1>
  <p> Lorem, ipsum dolor.</p>
  <p class="cls"> Lorem, ipsum dolor.</p>

  <!-- button -->
   <button type="button" class="btn1"> Submit</button>
   <button type="button" class="btn2"> Learn More </button>
</body>
</html>
