<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --var1:255, 0, 0;
            --var2:black;
            --small-size:12px;
        }
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        .elt1{
            width: 30px;
            height: 30px;
            border:4px solid rgb(var(--var1),.5);
            border-radius: 50%;
            border-top-color:#00009945;
            animation: spinner 1s  infinite;
        }
        @keyframes spinner{
            0%{
                rotate:0deg;
            }
            100%{
                    rotate:360deg;
            }
        }

        .elt2{
             width: 30px;
             font-size: var(--small-size);
            height: 30px;
            background: orange;
            border-radius: 50%;
            animation:glow 1s linear infinite;
        }
        @keyframes glow {
            0%,100%{
                scale:0;
                opacity: 0;
            }
            50%{scale:1;opacity: 1;}
        }
        .bar{
            background: #00009934;
            overflow: hidden;
            width: 90%;
            max-width: 450px;
            margin: 30px auto;
        }
        .bar .pro{
            padding: 2px;
            background: var(--var2);
            width: 100%;
            animation:flow 1s linear;
            margin: auto;
        }

     @keyframes flow {
        0%{width: 0%;}
     }

    </style>
</head>
<body>
    <!-- animations -->
     <div class="bar">
        <div class="pro"></div>
     </div>
     <div class="flow troll"></div>
     <div class="elt1"></div>

     <div class="container"></div>
     <style>
        .container{
            background: orange;
            padding: 40px;
            @media screen and (min-width:768px) {   
                background: blue;
            }
        }
     </style>
</body>
</html>
