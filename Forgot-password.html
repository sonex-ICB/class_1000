<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        form {
            width: 90%;
            max-width: 400px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 0 14px 0 #80808067;
            background: #fff;
            padding: 12px;
        }

        input,
        button {
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            display: block;
            margin: 10px auto;
            width: 100%;
        }

        button {
            background: #007;
            color: #fff;
            font-weight: bold;
            border: 0;
        }

        a.back {
            font-weight: bold;
            color: #007;
            text-decoration: none;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #155;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        h3 {
            color: #007;
            font-size: 30px;
            text-align: center;
            padding: 30px 0;
        }
        body{
            background: #ccc;
        }
    </style>
</head>

<body>
    <form action="">
        <h3> EdiStyles</h3>
        <div class="title"> Forgot Password </div>
        <label for=""> Enter Recovery Email </label>
        <input type="email" required>
        <button type="submit"> Submit</button>
        <a class="back" href="signin.html"> Back to login </a>
    </form>

</body>

</html>
